# Drives VEYRA Keeper's schedule: the keeper cycle every 4 hours (it acts only when its rule says so,
# and at least once per UTC day), and a delivery-and-settlement sweep every 15 minutes for buyers who
# fund a job but never send notify_funded. Both call the live agent; the agent wallet's key never
# leaves Vercel.
name: keeper
on:
  schedule:
    - cron: '5 */4 * * *'
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  keeper:
    if: github.event.schedule != '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run one keeper cycle
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -m 110 -X POST -H "Authorization: Bearer $CRON_SECRET" https://veyra-keeper.vercel.app/api/keeper
  sweep:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deliver and settle funded jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -m 110 -X POST -H "Authorization: Bearer $CRON_SECRET" https://veyra-keeper.vercel.app/api/sweep
